name: pages

# Renders the root wire tree (config.json, c/, p/) with the ocx-catalog renderer and publishes it; the renderer mirrors the index wire files
# (/config.json, /c/index.json, /p/**) to the site root unchanged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      # The renderer reads a source dir holding only the wire files, not the whole repository.
      - run: mkdir wire-src && cp -r config.json c p .nojekyll wire-src/
      - run: bun x ocx-catalog build --out site-out
      # The index URL promises the committed wire bytes; fail the deploy if the renderer served anything else.
      - run: diff -r wire-src site-out --exclude=.nojekyll | grep -v '^Only in site-out' | (! grep .)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
