name: pages

# Renders docs/ with the ocx-catalog renderer and publishes it, with the index wire files copied over the
# rendered site byte for byte so /config.json, /c/index.json and /p/** keep their bytes and URLs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: python3 scripts/stage_site_source.py
      - run: bun x ocx-catalog build --out site-out
      # The renderer mirrors the staged roots, which carry extra fields; serve the committed wire bytes instead.
      - run: |
          cp -rf docs/config.json docs/c docs/p site-out/
          find site-out/p -name _root.json -delete
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
